name: Apple build
on:
  push:
    paths:
      - Apple/**
      - Shared/**
      - Tests/**
      - tools/**
      - BurstLab.xcodeproj/**
      - Package.swift
      - .github/workflows/apple-build.yml
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Structural project validation
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install --quiet -r tools/requirements-dev.txt
          build/venv/bin/python tools/validate_project.py
      - name: BurstCore tests
        run: swift test
      - name: IPA packaging tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: iOS simulator build
        run: xcodebuild -project BurstLab.xcodeproj -scheme BurstLab-iOS -sdk iphonesimulator -derivedDataPath build/ios-simulator -configuration Debug build CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned iPhone IPA
        run: bash tools/build_unsigned_ipa.sh
      - name: Upload IPA for local signing on Windows
        uses: actions/upload-artifact@v7
        with:
          name: BurstLab-iPhone-unsigned
          path: |
            build/dist/BurstLab-unsigned.ipa
            build/dist/BurstLab-build.json
          if-no-files-found: error
          retention-days: 7
